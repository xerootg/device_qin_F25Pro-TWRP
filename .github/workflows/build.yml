name: TWRP CI

on:
  push:
    branches:
      - TWRP
  workflow_dispatch:

env:
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  MANIFEST_BRANCH: twrp-14.1
  DEVICE_PATH: device/qin/F25Pro
  DEVICE_NAME: F25Pro
  MAKEFILE_NAME: twrp_F25Pro
  BUILD_TARGET: vendorboot

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4
      with:
        path: device-tree

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        sudo apt install git aria2 -y
        mkdir ofx_scripts
        cd ofx_scripts
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@users.noreply.github.com"
        repo init --depth=1 -u ${{ env.MANIFEST_URL }} -b ${{ env.MANIFEST_BRANCH }}
      id: pwd

    - name: Repo Sync
      run: |
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all)
      working-directory: workspace

    - name: Copy device tree
      run: |
        mkdir -p workspace/${{ env.DEVICE_PATH }}
        cp -r device-tree/. workspace/${{ env.DEVICE_PATH }}/
        rm -rf workspace/${{ env.DEVICE_PATH }}/.git

    - name: Patch bootable/recovery for android-14.1
      run: |
        # twrp-14.1's bootable/recovery doesn't build against android-14.1
        # vold/soong out of the box (removed ndk_platform AIDL variants,
        # removed fscrypt_policy union, removed FDE cryptfs API).
        git -C workspace/bootable/recovery apply "$GITHUB_WORKSPACE/workspace/${{ env.DEVICE_PATH }}/patches/bootable-recovery-twrp-14.1.patch"

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Building recovery
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ env.MAKEFILE_NAME }}-ap2a-eng && make clean && make ${{ env.BUILD_TARGET }}image -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          workspace/out/target/product/${{ env.DEVICE_NAME }}/vendor_boot.img
        name: TWRP-F25Pro-${{ github.run_number }}
        tag_name: build-${{ github.run_number }}
        body: |
          TWRP vendor_boot image for the Qin F25 Pro (mt6768, DUOQIN F22Pro firmware)
          Manifest: ${{ env.MANIFEST_BRANCH }}
          Commit: ${{ github.sha }}

          Flash: `fastboot flash vendor_boot_a vendor_boot.img`
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
